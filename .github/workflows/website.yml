name: Build and deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'data/**'
      - 'assets/peck-icon-animated.svg'
      - 'assets/peck-badge-animated.svg'
      - 'assets/peck-badge-animated-dark.svg'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peck-website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Lint and build
        working-directory: website
        run: |
          npm run lint
          npm run build
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.WEBSITE_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.WEBSITE_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.WEBSITE_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.WEBSITE_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.WEBSITE_DEPLOY_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY DEPLOY_PATH; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing $name secret"; exit 1; fi
          done
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo '::error::Invalid SSH host'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo '::error::Invalid SSH user'; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && (( DEPLOY_PORT > 0 && DEPLOY_PORT <= 65535 )) || { echo '::error::Invalid SSH port'; exit 1; }
          DEPLOY_PATH="${DEPLOY_PATH%/}"
          [[ "$DEPLOY_PATH" =~ ^/([a-zA-Z0-9._-]+/)*[a-zA-Z0-9._-]+$ ]] && [[ ! "/$DEPLOY_PATH/" =~ /\.\.?/ ]] || { echo '::error::Deploy path must be an absolute path without dot-only components'; exit 1; }
          printf 'DEPLOY_ROOT=%s\n' "$DEPLOY_PATH" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/peck_website"
          chmod 600 "$HOME/.ssh/peck_website"
          printf 'Host peck-website\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile %s/.ssh/peck_website\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n' "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_PORT" "$HOME" >> "$HOME/.ssh/config"
      - name: Upload and activate release
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PATH="$DEPLOY_ROOT"
          timestamp="$(date -u +%Y%m%d%H%M%S)"
          release="${DEPLOY_PATH}/releases/${timestamp}"
          while :; do
            exists="$(ssh peck-website "if [ -e '$release' ]; then printf yes; else printf no; fi")"
            if [[ "$exists" == no ]]; then
              break
            fi
            sleep 1
            timestamp="$(date -u +%Y%m%d%H%M%S)"
            release="${DEPLOY_PATH}/releases/${timestamp}"
          done
          staging="$(ssh peck-website "mkdir -p '$DEPLOY_PATH/releases' && mktemp -d '$DEPLOY_PATH/releases/.staging-XXXXXX'")"
          cleanup_staging() {
            ssh peck-website "rm -rf '$staging'" || true
          }
          trap cleanup_staging EXIT
          rsync -az --delete website/dist/ "peck-website:$staging/"
          ssh peck-website "mv -T '$staging' '$release'"
          trap - EXIT
          ssh peck-website "set -eu
          releases_dir='$DEPLOY_PATH/releases'
          current='$DEPLOY_PATH/current'
          release='$release'
          candidate='$DEPLOY_PATH/.current-${timestamp}'
          backup='$DEPLOY_PATH/.current-backup-${timestamp}'
          if [ -e \"\$current\" ] && [ ! -d \"\$current\" ] && [ ! -L \"\$current\" ]; then
            echo 'current must be a directory, symlink, or absent' >&2
            exit 1
          fi
          for stale_backup in '$DEPLOY_PATH'/.current-backup-*; do
            [ -e \"\$stale_backup\" ] || [ -L \"\$stale_backup\" ] || continue
            if [ -e \"\$current\" ] || [ -L \"\$current\" ]; then
              rm -rf \"\$stale_backup\"
            else
              mv \"\$stale_backup\" \"\$current\"
            fi
          done
          rm -rf '$DEPLOY_PATH'/.current-*
          activated=false
          if [ -L \"\$current\" ]; then
            rm -rf \"\$candidate\" \"\$backup\"
            mkdir -p \"\$candidate\"
            if ! rsync -a --delete \"\$release/\" \"\$candidate/\"; then
              rm -rf \"\$candidate\"
              exit 1
            fi
            if ! mv \"\$current\" \"\$backup\"; then
              rm -rf \"\$candidate\"
              exit 1
            fi
            if ! mv \"\$candidate\" \"\$current\"; then
              rm -rf \"\$candidate\"
              if ! mv \"\$backup\" \"\$current\"; then
                echo 'could not restore current after activation failed' >&2
              fi
              exit 1
            fi
            rm -rf \"\$backup\"
            activated=true
          elif [ ! -e \"\$current\" ]; then
            mkdir -p \"\$current\"
          fi
          if [ \"\$activated\" != true ]; then
            rsync -a --delete \"\$release/\" \"\$current/\"
          fi
          rm -rf \"\$releases_dir\"/.staging-* \"\$releases_dir\"/.versions-*
          versions_file=\"\$releases_dir/.versions-${timestamp}\"
          old_versions_file=\"\$releases_dir/.old-versions-${timestamp}\"
          : > \"\$versions_file\"
          for path in \"\$releases_dir\"/*; do
            [ -d \"\$path\" ] || continue
            name=\"\${path##*/}\"
            case \"\$name\" in
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9])
                printf '%s\\n' \"\$name\" >> \"\$versions_file\"
                ;;
              *)
                rm -rf \"\$path\"
                ;;
            esac
          done
          sort -r \"\$versions_file\" > \"\$old_versions_file\"
          tail -n +4 \"\$old_versions_file\" > \"\$old_versions_file.tmp\"
          while IFS= read -r old; do
            rm -rf \"\$releases_dir/\$old\"
          done < \"\$old_versions_file.tmp\"
          rm -f \"\$versions_file\" \"\$old_versions_file\" \"\$old_versions_file.tmp\""

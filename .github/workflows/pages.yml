name: Deploy Peck link page

on:
  push:
    branches: [main]
    paths:
      - "docs/peck-link/**"
      - "assets/peck-icon.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare page
        run: cp assets/peck-icon.svg docs/peck-link/peck-icon.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/peck-link
      - id: deployment
        uses: actions/deploy-pages@v4

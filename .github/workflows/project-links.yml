name: Render project links

on:
  push:
    branches: [main]
    paths:
      - "data/project-links.json"
      - "data/project-links.schema.json"
      - ".github/scripts/render-project-links.mjs"
      - ".github/workflows/project-links.yml"
  pull_request:
    paths:
      - "data/project-links.json"
      - "data/project-links.schema.json"
      - ".github/scripts/render-project-links.mjs"
      - ".github/workflows/project-links.yml"
  workflow_dispatch:

concurrency:
  group: project-links-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate project link catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate JSON catalog
        run: node .github/scripts/render-project-links.mjs --validate

  render:
    name: Update README
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Render README table
        run: node .github/scripts/render-project-links.mjs --write
      - name: Commit generated README
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update project links"
          git push

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The app depends on a small set of Viva changes that are kept in the author's
# Viva fork. Keep this commit aligned with the local tmp/viva checkout before
# creating a new Peck tag. The checkout is deliberately outside the public
# Peck tree and is ignored by .gitignore.
env:
  VIVA_REPOSITORY: ${{ vars.VIVA_REPOSITORY || 'eryajf/viva' }}
  VIVA_REF: ${{ vars.VIVA_REF || '8b48f3af440de90a1259a917c948f165c83568e5' }}

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: amd64
            runner: macos-15-intel
    steps:
      - name: Check out Peck
        uses: actions/checkout@v7

      - name: Check out the pinned Viva source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.VIVA_REPOSITORY }}
          ref: ${{ env.VIVA_REF }}
          path: tmp/viva
          token: ${{ secrets.VIVA_REPO_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify the tag matches viva.toml
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' viva.toml | head -1)
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match viva.toml version ${version}"
            exit 1
          fi

      - name: Check Apple signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::missing Apple release secrets: ${missing[*]}"
            exit 1
          fi

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Build macOS packages
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/build/release/${{ matrix.arch }}/Peck.app"
          mkdir -p "$(dirname "$out")"
          args=(package --target darwin --arch "${{ matrix.arch }}" --format zip,dmg --out "$out")
          args+=(--notarize)
          go tool viva "${args[@]}"

      - name: Verify the signed and notarized packages
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/build/release/${{ matrix.arch }}/Peck.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for image in "$GITHUB_WORKSPACE"/build/release/${{ matrix.arch }}/*.dmg; do
            xcrun stapler validate "$image"
            spctl -a -vvv -t open --context context:primary-signature "$image"
          done

      - name: Upload architecture packages
        uses: actions/upload-artifact@v4
        with:
          name: peck-${{ matrix.arch }}
          path: |
            build/release/${{ matrix.arch }}/*.zip
            build/release/${{ matrix.arch }}/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: peck-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum *.zip *.dmg > SHA256SUMS
          )

      - name: Build release notes header
        id: release_header
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          {
            echo 'header<<EOF'
            echo '## Downloads'
            echo
            echo '| Package | Download |'
            echo '| --- | --- |'
            for file in dist/*.dmg dist/*.zip; do
              name="${file##*/}"
              printf '| %s | [`%s`](%s/%s) |\n' "${name}" "${name}" "${base}" "${name}"
            done
            echo
            echo '## Checksums'
            echo
            echo "- [SHA256SUMS](${base}/SHA256SUMS)"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Draft release notes
        id: draft_release_notes
        uses: release-drafter/release-drafter@v7
        with:
          tag: ${{ github.ref_name }}
          name: Peck ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          config-name: release-drafter.yml
          dry-run: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Merge preserved release notes
        id: release_notes
        uses: actions/github-script@v8
        env:
          RELEASE_HEADER: ${{ steps.release_header.outputs.header }}
          FALLBACK_BODY: ${{ steps.draft_release_notes.outputs.body }}
        with:
          script: |
            const { dedupeChangeEntries, stripManagedSections } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-notes.cjs`);
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const existing = releases.find((release) => release.tag_name === process.env.GITHUB_REF_NAME);
            const body = existing?.body?.trim() ? existing.body : process.env.FALLBACK_BODY || '';
            const merged = [process.env.RELEASE_HEADER, stripManagedSections(body)].filter(Boolean).join('\n\n');
            core.setOutput('body', `${dedupeChangeEntries(merged)}\n`);

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.body }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" dist/* --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Peck $tag" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --latest
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" dist/* \
              --title "Peck $tag" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi

  sync-release-to-cnb:
    name: Sync release to CNB
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure the tag exists on CNB
        env:
          CNB_USERNAME: ${{ secrets.CNB_USERNAME }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CNB_USERNAME:?Missing CNB_USERNAME secret}"
          : "${CNB_TOKEN:?Missing CNB_TOKEN secret}"
          askpass="$RUNNER_TEMP/cnb-askpass"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" "$CNB_USERNAME" ;; *) printf "%s\n" "$CNB_TOKEN" ;; esac' > "$askpass"
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git push https://cnb.cool/znb/Peck.git "${GITHUB_REF}:${GITHUB_REF}"
      - name: Sync release and assets
        env:
          CNB_USERNAME: ${{ secrets.CNB_USERNAME }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CNB_USERNAME:?Missing CNB_USERNAME secret}"
          : "${CNB_TOKEN:?Missing CNB_TOKEN secret}"
          curl -fsSL https://cnb.cool/znb/mpgrm/-/releases/download/v0.1.0/mpgrm_linux_amd64.tar.gz -o "$RUNNER_TEMP/mpgrm.tar.gz"
          tar -xf "$RUNNER_TEMP/mpgrm.tar.gz" -C "$RUNNER_TEMP" mpgrm
          chmod +x "$RUNNER_TEMP/mpgrm"
          "$RUNNER_TEMP/mpgrm" releases sync \
            --repo "https://github.com/${GITHUB_REPOSITORY}.git" \
            --target-repo "https://cnb.cool/znb/Peck.git" \
            --tags "$GITHUB_REF_NAME"
